<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Магазин товаров для интровертов</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="header-main">
        <img
                src="logo.png"
                title="я не я без кофе и свитера"
                alt="тут логотип-стесняшка-социофоб с кофе и в свитере"
                class="logo"
        >
        <h1>лив ми элон</h1>
    </div>

    <button id="cart-btn" class="cart-btn">
        🛒 корзина (<span id="cart-count">0</span>)
    </button>
</header>

<main class="container">
    <h2 class="section-title">Каталог уютных вещей</h2>

    <section class="catalog">
        <article class="product-card">
            <img
                    src="blanket.png"
                    title="плед зеленый с сердечками"
                    alt="плед для личного пространства"
                    class="product-img"
            >
            <h3 class="product-title">плед «я в домике»</h3>
            <p class="product-price">2 500 ₽</p>
            <button class="add-to-cart-btn" data-id="1">добавить в корзину</button>
        </article>

        <article class="product-card">
            <img
                    src="blanket.png"
                    title="плед зеленый с сердечками"
                    alt="плед для личного пространства"
                    class="product-img"
            >
            <h3 class="product-title">плед «я в домике»</h3>
            <p class="product-price">2 500 ₽</p>
            <button class="add-to-cart-btn" data-id="1">добавить в корзину</button>
        </article>

        <article class="product-card">
            <img
                    src="blanket.png"
                    title="плед зеленый с сердечками"
                    alt="плед для личного пространства"
                    class="product-img"
            >
            <h3 class="product-title">плед «я в домике»</h3>
            <p class="product-price">2 500 ₽</p>
            <button class="add-to-cart-btn" data-id="1">добавить в корзину</button>
        </article>
    </section>
</main>

</body>
</html>
